name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Library, examples and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Library typecheck and tests (incl. docs: links, skill frontmatter,
      # quoted compiler output), then every example's typecheck, lint and tests.
      - run: pnpm check
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack" # builds dist/ via prepack
      - name: Packed package works for consumers
        run: test/support/smoke-package.sh "$RUNNER_TEMP"/pack/gdp-ts-*.tgz

  typescript:
    name: Type tests on TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.4 is the documented minimum; 7 runs in the job above.
        typescript: ["5.4", "5.5", "5.6", "5.9", "6.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npx --yes --package=typescript@${{ matrix.typescript }} tsc -p tsconfig.compat.json

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color
